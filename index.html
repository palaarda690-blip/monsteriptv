<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonsterIPTV - Ulusal Canlı TV</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Icon Set -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Video.js Kütüphanesi -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header / Navigasyon -->
    <header class="navbar">
        <div class="container nav-container">
            <a href="#" class="logo">
                <i class="fa-solid fa-dragon logo-icon"></i>
                <span>MONSTER<b>IPTV</b></span>
            </a>
            <div class="nav-btn">
                <span class="free-badge"><i class="fa-solid fa-signal"></i> KESİNTİSİZ YAYIN</span>
            </div>
        </div>
    </header>

    <!-- Ana Video Oynatıcı Bölümü -->
    <section class="player-section">
        <div class="container">
            <div class="main-player-wrapper">
                
                <!-- Sol: Video.js Ekranı -->
                <div class="video-container">
                    <div class="video-wrapper">
                        <video id="iptv-player" class="video-js vjs-big-play-centered" controls preload="auto" data-setup='{}'>
                            <source src="https://live.medya.yedic.net/smil:showtv.smil/playlist.m3u8" type="application/x-mpegURL">
                        </video>
                    </div>
                    <div class="now-playing-bar">
                        <div class="live-tag"><i class="fa-solid fa-circle"></i> CANLI</div>
                        <h2 id="current-channel-title">Show TV</h2>
                    </div>
                </div>

                <!-- Sağ: Kanal Seçim Listesi -->
                <div class="channel-sidebar">
                    <div class="sidebar-header">
                        <h3><i class="fa-solid fa-list"></i> Ulusal Kanallar</h3>
                        <span class="count-tag">HD</span>
                    </div>
                    <div class="channel-list" id="channel-list">
                        <!-- Show TV -->
                        <button class="channel-btn active" data-url="https://live.medya.yedic.net/smil:showtv.smil/playlist.m3u8" data-title="Show TV">
                            <i class="fa-solid fa-tv"></i>
                            <span>Show TV</span>
                        </button>

                        <!-- Now TV -->
                        <button class="channel-btn" data-url="https://live.foxplay.com.tr/live/fox-tv.m3u8" data-title="Now TV">
                            <i class="fa-solid fa-video"></i>
                            <span>Now TV</span>
                        </button>

                        <!-- Kanal D -->
                        <button class="channel-btn" data-url="https://demiroren-live.daioncdn.net/kanald/kanald.m3u8" data-title="Kanal D">
                            <i class="fa-solid fa-film"></i>
                            <span>Kanal D</span>
                        </button>

                        <!-- TRT 1 -->
                        <button class="channel-btn" data-url="https://tv-trt1.live.trt.com.tr/master.m3u8" data-title="TRT 1">
                            <i class="fa-solid fa-tv"></i>
                            <span>TRT 1</span>
                        </button>

                        <!-- TRT Haber -->
                        <button class="channel-btn" data-url="https://tv-trthaber.live.trt.com.tr/master.m3u8" data-title="TRT Haber">
                            <i class="fa-solid fa-newspaper"></i>
                            <span>TRT Haber</span>
                        </button>

                        <!-- TRT Spor -->
                        <button class="channel-btn" data-url="https://tv-trtspor.live.trt.com.tr/master.m3u8" data-title="TRT Spor">
                            <i class="fa-solid fa-futbol"></i>
                            <span>TRT Spor</span>
                        </button>

                        <!-- TRT Belgesel -->
                        <button class="channel-btn" data-url="https://tv-trtbelgesel.live.trt.com.tr/master.m3u8" data-title="TRT Belgesel">
                            <i class="fa-solid fa-earth-americas"></i>
                            <span>TRT Belgesel</span>
                        </button>

                        <!-- TRT Çocuk -->
                        <button class="channel-btn" data-url="https://tv-trtcocuk.live.trt.com.tr/master.m3u8" data-title="TRT Çocuk">
                            <i class="fa-solid fa-child"></i>
                            <span>TRT Çocuk</span>
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container footer-content">
            <p>&copy; 2026 MonsterIPTV. GitHub Pages ile barındırılmaktadır.</p>
        </div>
    </footer>

    <!-- Video.js JS Kütüphanesi -->
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
