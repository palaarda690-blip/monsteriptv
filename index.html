<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonsterIPTV - Ücretsiz Canlı TV</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Icon Set -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Clappr Player Kütüphanesi -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@clappr/player@latest/dist/clappr.min.js"></script>
    <!-- CSS Dosyası -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header / Navigasyon -->
    <header class="navbar">
        <div class="container nav-container">
            <a href="#" class="logo">
                <i class="fa-solid fa-dragon logo-icon"></i>
                <span>MONSTER<b>IPTV</b></span>
            </a>
            <div class="nav-btn">
                <span class="free-badge"><i class="fa-solid fa-signal"></i> ÜCRETSİZ CANLI YAYIN</span>
            </div>
        </div>
    </header>

    <!-- Ana Video Oynatıcı Bölümü -->
    <section class="player-section">
        <div class="container">
            <div class="main-player-wrapper">
                
                <!-- Sol: Clappr Video Ekranı -->
                <div class="video-container">
                    <div id="clappr-player"></div>
                    <div class="now-playing-bar">
                        <div class="live-tag"><i class="fa-solid fa-circle"></i> CANLI</div>
                        <h2 id="current-channel-title">PatronSpor</h2>
                    </div>
                </div>

                <!-- Sağ: Kanal Seçim Listesi -->
                <div class="channel-sidebar">
                    <div class="sidebar-header">
                        <h3><i class="fa-solid fa-list"></i> Yayın Listesi</h3>
                        <span class="count-tag">HD / 4K</span>
                    </div>
                    <div class="channel-list" id="channel-list">
                        <!-- 1. Kanal: PatronSpor (Ana Yayın) -->
                        <button class="channel-btn active" data-url="https://2i4.d72577a9dd0ec71.cfd/patron/mono.m3u8" data-title="PatronSpor">
                            <i class="fa-solid fa-futbol"></i>
                            <span>PatronSpor</span>
                        </button>

                        <!-- 2. Kanal: Örnek Yedek Yayın -->
                        <button class="channel-btn" data-url="https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" data-title="Yedek Test Yayını">
                            <i class="fa-solid fa-tv"></i>
                            <span>Yedek Test Yayını</span>
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container footer-content">
            <p>&copy; 2026 MonsterIPTV. GitHub Pages ile barındırılmaktadır.</p>
        </div>
    </footer>

    <!-- JS Dosyası -->
    <script src="script.js"></script>
</body>
</html>
