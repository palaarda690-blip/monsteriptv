<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonsterIPTV - Ücretsiz Canlı TV</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Icon Set -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Video.js Kütüphanesi -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header / Navigasyon -->
    <header class="navbar">
        <div class="container nav-container">
            <a href="#" class="logo">
                <i class="fa-solid fa-dragon logo-icon"></i>
                <span>MONSTER<b>IPTV</b></span>
            </a>
            <div class="nav-btn">
                <span class="free-badge"><i class="fa-solid fa-signal"></i> ÜCRETSİZ CANLI YAYIN</span>
            </div>
        </div>
    </header>

    <!-- Ana Video Oynatıcı Bölümü -->
    <section class="player-section">
        <div class="container">
            <div class="main-player-wrapper">
                
                <!-- Sol: Video.js Ekranı -->
                <div class="video-container">
                    <div class="video-wrapper">
                        <video id="iptv-player" class="video-js vjs-big-play-centered" controls preload="auto" data-setup='{}'>
                            <source src="https://taraftarium24fb.com/b1/mono.m3u8" type="application/x-mpegURL">
                        </video>
                    </div>
                    <div class="now-playing-bar">
                        <div class="live-tag"><i class="fa-solid fa-circle"></i> CANLI</div>
                        <h2 id="current-channel-title">Taraftarium Maç Yayını</h2>
                    </div>
                </div>

                <!-- Sağ: Kanal Seçim Listesi -->
                <div class="channel-sidebar">
                    <div class="sidebar-header">
                        <h3><i class="fa-solid fa-list"></i> Yayın Listesi</h3>
                        <span class="count-tag">HD / 4K</span>
                    </div>
                    <div class="channel-list" id="channel-list">
                        <!-- 1. Kanal: Yeni Eklenen Maç Yayını -->
                        <button class="channel-btn active" data-url="https://taraftarium24fb.com/b1/mono.m3u8" data-title="Taraftarium Maç Yayını">
                            <i class="fa-solid fa-futbol"></i>
                            <span>Taraftarium Maç Yayını</span>
                        </button>

                        <!-- 2. Kanal: Örnek Test Yayını -->
                        <button class="channel-btn" data-url="https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" data-title="Örnek Canlı Yayın 1">
                            <i class="fa-solid fa-tv"></i>
                            <span>Örnek Canlı Yayın 1</span>
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container footer-content">
            <p>&copy; 2026 MonsterIPTV. GitHub Pages ile barındırılmaktadır.</p>
        </div>
    </footer>

    <!-- Video.js JS Kütüphanesi -->
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
